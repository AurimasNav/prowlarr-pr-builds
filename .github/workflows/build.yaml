# Builds a container image of Prowlarr with one open pull request merged into a Prowlarr
# branch (default: develop), so the PR can be tried in a test instance before it is released.
#
# Two jobs on purpose: "build" runs the PR's code (msbuild, yarn) with a read-only token and
# hands over a tarball; only "image" can write packages, and it runs no PR code.
name: Build Prowlarr PR image

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Prowlarr pull request number
        required: true
        default: "2765"
      base:
        description: Prowlarr branch to merge the pull request into
        required: true
        default: develop

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.merge.outputs.tag }}
      version: ${{ steps.merge.outputs.version }}
      base_sha: ${{ steps.merge.outputs.base_sha }}
      pr_sha: ${{ steps.merge.outputs.pr_sha }}
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: builder
        persist-credentials: false

    - name: Merge the pull request into the base branch
      id: merge
      shell: pwsh
      env:
        PR: ${{ inputs.pr }}
        BASE: ${{ inputs.base }}
      run: ./builder/scripts/Merge-ProwlarrPr.ps1 -Pr $env:PR -Base $env:BASE -Path prowlarr

    - name: Set up .NET (SDK from Prowlarr's global.json)
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: prowlarr/global.json

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"

    - name: Backend (linux-musl-x64)
      working-directory: prowlarr
      env:
        PROWLARRVERSION: ${{ steps.merge.outputs.version }}
      run: ./build.sh --backend --framework net10.0 --runtime linux-musl-x64

    - name: Frontend (yarn 1 from the runner image)
      working-directory: prowlarr
      run: ./build.sh --frontend

    - name: Package
      working-directory: prowlarr
      env:
        PROWLARRVERSION: ${{ steps.merge.outputs.version }}
      run: |
        ./build.sh --packages --framework net10.0 --runtime linux-musl-x64
        tar -C _artifacts/linux-musl-x64/net10.0 -czf "$GITHUB_WORKSPACE/prowlarr.tar.gz" Prowlarr

    - name: Upload the package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: prowlarr-linux-musl-x64
        path: prowlarr.tar.gz
        retention-days: 3
        if-no-files-found: error

  test:
    # The PR's own unit tests for its indexer (the live tests skip themselves without
    # credentials). Informational: the image is built either way.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: builder
        persist-credentials: false

    - name: Merge the pull request into the base branch
      shell: pwsh
      env:
        PR: ${{ inputs.pr }}
        BASE: ${{ inputs.base }}
      run: ./builder/scripts/Merge-ProwlarrPr.ps1 -Pr $env:PR -Base $env:BASE -Path prowlarr

    - name: Set up .NET (SDK from Prowlarr's global.json)
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: prowlarr/global.json

    - name: Run the PR's indexer tests
      working-directory: prowlarr
      run: >-
        dotnet test src/NzbDrone.Core.Test/Prowlarr.Core.Test.csproj
        -p:Platform=Posix
        --filter "FullyQualifiedName~LostFilm"
        --logger "console;verbosity=normal"

  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out this repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: prowlarr-linux-musl-x64

    - name: Build and push the image
      shell: pwsh
      env:
        TAG: ${{ needs.build.outputs.tag }}
        VERSION: ${{ needs.build.outputs.version }}
        BASE_SHA: ${{ needs.build.outputs.base_sha }}
        PR_SHA: ${{ needs.build.outputs.pr_sha }}
        PR: ${{ inputs.pr }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./scripts/Publish-Image.ps1
